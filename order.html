<section class="page-header">

    <p class="section-title">FALCON 2022</p>

    <h1>Order Fresh Catfish</h1>

    <p>
        Fill in the form below and send your order
        directly to us on WhatsApp.
    </p>

</section>


<section class="order-section">

    <form id="orderForm">

        <label>Full Name</label>

        <input
            type="text"
            id="customerName"
            placeholder="Enter your full name"
            required
        >


        <label>Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            required
        >


        <label>Catfish Type</label>

        <select id="fishType">

            <option value="Fresh Catfish">
                Fresh Catfish
            </option>

        </select>


        <label>Quantity (kg)</label>

        <input
            type="number"
            id="quantity"
            min="1"
            value="1"
            required
        >


        <div class="price-box">

            <p>Price per kg</p>

            <h3>GH₵50</h3>

        </div>


        <div class="total-box">

            <p>Total Order Amount</p>

            <h2 id="totalPrice">
                GH₵50
            </h2>

        </div>


        <label>Order Method</label>

        <select id="deliveryMethod">

            <option value="Pickup">
                Pickup
            </option>

            <option value="Delivery">
                Delivery
            </option>

        </select>


        <label>Delivery / Pickup Location</label>

        <input
            type="text"
            id="location"
            placeholder="Enter your location"
            required
        >


        <label>Additional Message</label>

        <textarea
            id="message"
            rows="5"
            placeholder="Any additional information..."
        ></textarea>


        <button
            type="submit"
            class="whatsapp-order-button"
        >
            💬 Send Order on WhatsApp
        </button>

    </form>

</section>


<footer>

    <img
        src="images/logo.png"
        alt="Falcon 2022"

    >
